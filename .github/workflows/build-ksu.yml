# 云编译一加 7/7T（sm8150）LineageOS 内核，加入 KernelSU-Next（manual hook）
# + SUSFS，打包成 AnyKernel3 刷机包。
#
# - push 到 lineage-24.0-ksu    → 编译，zip 上传为本次运行的 Artifact
# - 在 Actions 页面手动运行     → 编译，可选先 rebase 到 LineageOS lineage-24.0
#                                 最新提交，可选发布为 Release
# - 每天定时                    → LineageOS lineage-24.0 有新提交时，rebase 上去、
#                                 编译并发布 Release。rebase 冲突时运行失败
#                                 （GitHub 会发邮件），分支本身永远不会被推送修改。
#                                 定时任务只在仓库默认分支上运行，要启用就把
#                                 lineage-24.0-ksu 设为默认分支。
name: Build KSU kernel

on:
  push:
    branches: [lineage-24.0-ksu]
    paths-ignore: ['**/*.md'] # 只改文档不编译
  workflow_dispatch:
    inputs:
      rebase_upstream:
        description: 先 rebase 到 LineageOS 上游最新提交再编译（只在云端，不推送分支）
        type: boolean
        default: false
      localversion:
        description: 手动指定版本后缀，如 -g9f007fac27dc（留空 = 用所基于的上游提交自动计算）
        type: string
        default: ''
      release:
        description: 发布为 GitHub Release（否则只上传 Artifact）
        type: boolean
        default: true
  schedule:
    - cron: '0 20 * * *' # 每天北京时间 04:00

permissions:
  contents: write # 发布 Release 需要

concurrency:
  group: build-ksu # 同一时间只跑一个编译，后来的排队
  cancel-in-progress: false

env:
  KSU_BRANCH: lineage-24.0-ksu
  UPSTREAM_URL: https://github.com/LineageOS/android_kernel_oneplus_sm8150.git
  UPSTREAM_BRANCH: lineage-24.0
  # AOSP clang，固定在 platform/prebuilts/clang/host/linux-x86 最后一个公开提交
  # （2025 年 3 月起 AOSP 不再在这里公开发布新的 clang）
  CLANG_NAME: clang-r547379
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/70a12c4fe88940ab2b0e6d763492dffa2f07e15a/clang-r547379.tgz

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }} # gh 命令发布 Release 用
    steps:
      # 定时任务固定编译 lineage-24.0-ksu；push 和手动运行编译触发的那个提交
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && env.KSU_BRANCH || github.sha }}
          fetch-depth: 100

      # 找出本分支基于哪个 LineageOS 提交，以及上游最新是哪个提交
      - name: 查找 LineageOS 基点
        id: base
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch -q --no-tags --depth=100 upstream \
            "$UPSTREAM_BRANCH:refs/remotes/upstream/$UPSTREAM_BRANCH"
          up_ref=upstream/$UPSTREAM_BRANCH
          # 两边都是浅克隆，找不到共同祖先就加深历史再找
          for d in 500 5000; do
            git merge-base HEAD "$up_ref" >/dev/null 2>&1 && break
            git fetch -q --no-tags --deepen=$d origin "$(git rev-parse HEAD)"
            git fetch -q --no-tags --deepen=$d upstream "$UPSTREAM_BRANCH"
          done
          base=$(git merge-base HEAD "$up_ref")
          up=$(git rev-parse "$up_ref")
          head=$(git rev-parse HEAD)
          echo "本分支提交:        $head"
          echo "基于 LineageOS:    $base"
          echo "LineageOS 最新:    $up"
          {
            echo "base=$base"
            echo "up=$up"
            echo "head=$head"
          } >>"$GITHUB_OUTPUT"

      # 根据触发方式决定：要不要编译、要不要 rebase、要不要发布 Release、tag 名
      - name: 决定本次要做什么
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_REBASE: ${{ inputs.rebase_upstream }}
          IN_RELEASE: ${{ inputs.release }}
          BASE: ${{ steps.base.outputs.base }}
          UP: ${{ steps.base.outputs.up }}
          HEAD_SHA: ${{ steps.base.outputs.head }}
        run: |
          build=true rebase=false release=false
          tag=build-${GITHUB_RUN_NUMBER}
          case $EVENT in
          workflow_dispatch)
            [ "$IN_REBASE" = true ] && [ "$UP" != "$BASE" ] && rebase=true
            [ "$IN_RELEASE" = true ] && release=true
            ;;
          schedule)
            # tag 包含上游提交和本分支提交，同样的组合只编译一次
            tag=auto-g${UP:0:12}-${HEAD_SHA:0:12}
            release=true
            if [ "$UP" = "$BASE" ]; then
              echo "LineageOS 上游没有新提交，跳过"
              build=false
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag 已经编译过，跳过"
              build=false
            else
              rebase=true
            fi
            ;;
          esac
          echo "build=$build rebase=$rebase release=$release tag=$tag"
          {
            echo "build=$build"
            echo "rebase=$rebase"
            echo "release=$release"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

      # 只在云端临时 rebase，不推送；有冲突就让本次运行失败
      - name: rebase 到 LineageOS ${{ env.UPSTREAM_BRANCH }}
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.rebase == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git rebase "upstream/$UPSTREAM_BRANCH"; then
            echo "::error::LineageOS 上游的新提交与 KSU/SUSFS 改动冲突，需要在本地手动 rebase 解决："
            git status --short | grep -E '^(UU|AA|DU|UD) ' || true
            git rebase --abort
            exit 1
          fi
          git log --oneline "upstream/$UPSTREAM_BRANCH~1..HEAD"

      - name: 安装编译依赖
        if: steps.plan.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex cpio zip zstd
          # LTO 编译占空间，删掉这次用不到的预装工具腾出磁盘
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: 检出 KernelSU-Next
        if: steps.plan.outputs.build == 'true'
        run: |
          # 需要完整历史和 tag：KernelSU-Next 用它们计算版本号（管理器里显示的版本），
          # 浅克隆会导致版本号不对
          git submodule update --init KernelSU-Next
          git -C KernelSU-Next fetch -q --tags origin
          git -C KernelSU-Next describe --tags

      - name: 恢复 clang 缓存
        if: steps.plan.outputs.build == 'true'
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: ${{ env.CLANG_NAME }}-v1 # 改了精简规则时把 v1 改成 v2，强制重新下载

      - name: 下载 clang
        if: steps.plan.outputs.build == 'true' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          d=~/clang/$CLANG_NAME
          mkdir -p "$d"
          curl -fL --retry 3 "$CLANG_URL" | tar -C "$d" -xz
          # 只保留内核编译用得到的部分，缓存小一些
          rm -rf "$d"/{android_libc++,runtimes_ndk_cxx,musl,python3,share} "$d"/lib/clang/*/lib
          # 确认下载到的确实是指定版本
          "$d/bin/clang" --version | tee /dev/stderr | grep -q "${CLANG_NAME#clang-}"
          du -sh "$d"

      # NDK 用来编译 ksu_susfs 用户态工具
      - name: 安装 NDK
        if: steps.plan.outputs.build == 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: false

      - name: 编译
        if: steps.plan.outputs.build == 'true'
        id: build
        env:
          CLANG_DIR: /home/runner/clang/${{ env.CLANG_NAME }}
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          WORK: ${{ runner.temp }}/work
          PINNED_LOCALVERSION: ${{ inputs.localversion }}
          # 用上游分支计算版本后缀：rebase 之后基点会变成上游最新提交
          UPSTREAM_REF: upstream/${{ env.UPSTREAM_BRANCH }}
        run: ci/build.sh

      # 编译失败时也上传 build.log，方便排查
      - name: 上传 Artifact
        if: steps.plan.outputs.build == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name || 'build-log' }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.zip_ota }}
            ${{ runner.temp }}/work/dist/ksu_susfs
            ${{ runner.temp }}/work/out/build.log
          if-no-files-found: warn

      - name: 发布 Release
        if: steps.build.outcome == 'success' && steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
          ZIP_OTA: ${{ steps.build.outputs.zip_ota }}
          RELEASE: ${{ steps.build.outputs.release }}
          SUSFS: ${{ steps.build.outputs.susfs_version }}
          REBASED: ${{ steps.plan.outputs.rebase }}
          BRANCH_HEAD: ${{ steps.base.outputs.head }}
        run: |
          ksu=$(git -C KernelSU-Next describe --tags)
          base=$(git merge-base HEAD "upstream/$UPSTREAM_BRANCH")
          {
            echo "**内核版本**: \`$RELEASE\`"
            echo "**KernelSU-Next**: \`$ksu\`  **SUSFS**: \`$SUSFS\`"
            echo "**基于 LineageOS**: [\`${base:0:12}\`](${UPSTREAM_URL%.git}/commit/$base)"
            echo "**本仓库提交**: \`${BRANCH_HEAD:0:12}\`"
            if [ "$REBASED" = true ]; then
              echo
              echo "> 本次在云端自动 rebase 到了 LineageOS 最新提交，分支本身没有改动。"
              echo "> 本地同步: \`git fetch upstream && git rebase upstream/$UPSTREAM_BRANCH && git push -f\`"
            fi
            echo
            echo "版本后缀必须与手机上 LineageOS 内核一致（\`uname -r\` 末尾的 -gxxxxxxxxxxxx），否则 WiFi 模块无法加载。"
            echo
            echo "### 下载哪个"
            echo
            echo "两个包里的内核和 ksu_susfs 完全相同，区别只是刷到哪个槽位。"
            echo
            echo "| 文件 | 刷入方式 | 什么时候用 |"
            echo "|---|---|---|"
            echo "| \`$(basename "$ZIP")\` | **电脑 adb sideload**：Recovery → Apply update → Apply from ADB → \`adb sideload\` 本 zip<br>（系统没更新、只换内核时，也可以在管理器里“刷入 AnyKernel”） | 刷入**当前槽位**：首次刷入、root 丢了要恢复、只换内核 |"
            echo "| \`$(basename "$ZIP_OTA")\` | **手机管理器 AnyKernel3 刷入**：YouYouSU-Next → 安装 → 刷入 AnyKernel (.zip) | 刷入**另一个槽位**：系统更新器装完 OTA、**还没重启**时用，刷完再重启，root 不丢 |"
            echo
            echo "> ⚠️ OTA 包不要在 Recovery 里 sideload，也不要在没装 OTA 时刷，它会写到没在用的那个槽位。"
            echo "> 两个包刷入前都会自动对比版本后缀：和目标槽位系统自带的内核不一致就中止、不写入，并在日志里显示需要的后缀，按它下载或编译对应的包即可。"
            echo "> 想提前确认后缀：LineageOS 下载页该版本 \`build-manifest.xml\` 里 \`kernel_oneplus_sm8150\` 的 revision 前 12 位，或 OTA 装完后用 Kernel Flasher 查看另一个槽位。"
          } >notes.md
          # Release 的 tag 指向本分支原来的提交（云端 rebase 的结果没有推送）
          gh release create "$TAG" "$ZIP" "$ZIP_OTA" -R "$GITHUB_REPOSITORY" \
            --target "$BRANCH_HEAD" --title "$TAG (${RELEASE##*-perf-})" --notes-file notes.md
